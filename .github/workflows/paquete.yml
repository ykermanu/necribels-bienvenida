name: Armar paquete de bienvenida
on:
  push:
    branches: [main]
    paths: ["imagenes/**", "herramientas/armar.py", ".github/workflows/paquete.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python herramientas/armar.py
      - name: Guardar el paquete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salida
          git diff --cached --quiet || git commit -m "Paquete de bienvenida actualizado"
          git push
